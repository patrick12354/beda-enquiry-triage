<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BEDA — inspector</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel2: #1c212a; --line: #262d38;
    --ink: #e6e9ef; --dim: #97a1b0; --faint: #6b7482;
    --accent: #6ea8fe; --good: #5ec98b; --warn: #e3b341; --bad: #f0736a;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }
  header {
    position: sticky; top: 0; z-index: 10; background: #0f1115ee;
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .badge {
    font: 11px/1 var(--mono); padding: 4px 7px; border-radius: 4px;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
  }
  .badge.good { color: var(--good); border-color: #2b5f45; }
  .badge.warn { color: var(--warn); border-color: #5f5326; }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--dim);
    padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 13px;
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-selected="true"] { background: var(--panel2); color: var(--ink); border-color: var(--line); }

  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 49px); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { border-right: none !important; } }
  aside { border-right: 1px solid var(--line); overflow-y: auto; }
  section.pane { padding: 20px 24px 80px; overflow-y: auto; }

  .row {
    padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start;
  }
  .row:hover { background: var(--panel); }
  .row[aria-current="true"] { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .row code { font: 12px var(--mono); color: var(--faint); }
  .row .subj { font-size: 13px; }
  .row .meta { font-size: 11px; color: var(--faint); margin-top: 2px; }

  .pill { display: inline-block; font: 11px/1.6 var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); }
  .pill.file_and_notify { color: var(--good); border-color: #2b5f45; }
  .pill.request_missing_info { color: var(--accent); border-color: #2c4a76; }
  .pill.escalate_to_human { color: var(--warn); border-color: #5f5326; }
  .pill.log_no_reply { color: var(--dim); }
  .pill.quarantine { color: var(--bad); border-color: #6b3430; }

  h2 { font-size: 17px; margin: 0 0 4px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); margin: 26px 0 8px; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
  .src { white-space: pre-wrap; font: 12.5px/1.65 var(--mono); color: var(--dim); }
  .grid { display: grid; grid-template-columns: 170px 1fr; gap: 4px 14px; font-size: 13px; }
  .grid dt { color: var(--faint); }
  .grid dd { margin: 0; }
  .span { color: var(--faint); font: 11.5px var(--mono); }
  .origin { font: 10.5px var(--mono); color: var(--accent); }
  ul.reasons { list-style: none; padding: 0; margin: 0; }
  ul.reasons li { font: 12px/1.9 var(--mono); color: var(--dim); }
  ul.reasons li::before { content: "· "; color: var(--faint); }
  ul.reasons li.warn { color: var(--warn); }
  ul.reasons li.warn::before { content: "! "; }
  .draft { white-space: pre-wrap; font: 13px/1.7 ui-sans-serif, system-ui, sans-serif; background: var(--panel2); border-radius: 6px; padding: 14px; border: 1px solid var(--line); }
  button.act { background: var(--panel2); border: 1px solid var(--line); color: var(--ink); padding: 7px 13px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.act:hover { border-color: var(--accent); }
  button.act.primary { border-color: #2b5f45; color: var(--good); }
  button.act.danger { border-color: #6b3430; color: var(--bad); }
  input.name { background: var(--bg); border: 1px solid var(--line); color: var(--ink); padding: 7px 10px; border-radius: 6px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  td.mono, th.mono { font-family: var(--mono); }
  .note { color: var(--dim); font-size: 13px; }
  .banner { border-left: 3px solid var(--warn); background: #1e1a10; padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 10px; font-size: 13px; color: #f0dfae; }
  .banner.good { border-color: var(--good); background: #101c15; color: #bfe6cf; }
  .scroll-x { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>BEDA — intake, triage and response</h1>
  <span class="badge" id="mode">loading…</span>
  <span class="badge good" id="sent">0 sent</span>
  <span class="badge" id="chain">chain —</span>
  <nav id="tabs">
    <button data-tab="items" aria-selected="true">Items</button>
    <button data-tab="identity">Identity</button>
    <button data-tab="approvals">Approvals</button>
    <button data-tab="audit">Audit</button>
    <button data-tab="data">Source data</button>
  </nav>
  <a href="/" style="font-size:13px">← the story</a>
</header>

<main>
  <aside id="list"></aside>
  <section class="pane" id="pane"><p class="note">Loading…</p></section>
</main>

<script>
let S = null;            // server state
let tab = "items";
let selected = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (id) => document.getElementById(id);

async function load(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) { alert(data.error ?? "Request failed"); return; }
  S = data;
  if (!selected) selected = S.items[0]?.id ?? null;
  render();
}

function render() {
  el("mode").textContent = S.modeLabel;
  el("sent").textContent = S.stats.draftsSent + " sent";
  el("chain").textContent = S.auditVerified.ok ? "audit chain intact" : "AUDIT CHAIN BROKEN at #" + S.auditVerified.brokenAtSeq;
  el("chain").className = "badge " + (S.auditVerified.ok ? "good" : "warn");
  renderList();
  ({ items: renderItem, identity: renderIdentity, approvals: renderApprovals, audit: renderAudit, data: renderData }[tab])();
}

function renderList() {
  const aside = el("list");
  if (tab !== "items") { aside.style.display = "none"; document.querySelector("main").style.gridTemplateColumns = "1fr"; return; }
  aside.style.display = "";
  document.querySelector("main").style.gridTemplateColumns = window.innerWidth > 860 ? "300px 1fr" : "1fr";
  aside.innerHTML = S.items.map((i) => `
    <div class="row" data-id="${i.id}" aria-current="${i.id === selected}">
      <code>${i.id}</code>
      <div>
        <div class="subj">${esc(i.subject)}</div>
        <div class="meta">${esc(i.from ?? "—")}</div>
        <div style="margin-top:5px"><span class="pill ${i.decision.action}">${i.decision.action}</span>
        <span class="pill">${esc(S.intentLabels[i.decision.intent])}</span></div>
      </div>
    </div>`).join("");
  aside.querySelectorAll(".row").forEach((r) => r.onclick = () => { selected = r.dataset.id; render(); });
}

function fieldRows(i) {
  const keys = Object.keys(i.extraction);
  if (!keys.length) return `<p class="note">Nothing was extracted. For a quarantined item that is correct — it never reached a model.</p>`;
  return `<dl class="grid">` + keys.map((k) => {
    const f = i.extraction[k];
    return `<dt>${esc(k)}${i.approximate.includes(k) ? ' <span class="badge warn" style="padding:1px 4px">approx</span>' : ""}</dt>
      <dd>${esc(f.value)}
        <div class="span">read from “${esc(f.sourceSpan)}” <span class="origin">${esc(f.origin)}</span></div>
      </dd>`;
  }).join("") + `</dl>`;
}

function renderItem() {
  const i = S.items.find((x) => x.id === selected);
  const pane = el("pane");
  if (!i) { pane.innerHTML = "<p class='note'>Select an item.</p>"; return; }
  const d = i.decision;

  pane.innerHTML = `
    <h2>${i.id} · ${esc(i.subject)}</h2>
    <p class="note">${esc(i.fromName ? i.fromName + " <" + i.from + ">" : i.from ?? "unknown sender")}</p>

    <h3>What the system decided</h3>
    <div class="card">
      <div style="margin-bottom:10px">
        <span class="pill ${d.action}">${d.action}</span>
        <span class="pill">${esc(S.intentLabels[d.intent])}</span>
        <span class="pill">→ ${esc(d.ownerName)}</span>
        <span class="pill">SLA ${d.slaHours}h</span>
        ${d.consult.length ? `<span class="pill">consult ${d.consult.map((c) => esc(S.staff[c] ? S.staff[c].name : c)).join(", ")}</span>` : ""}
      </div>
      <p class="note" style="margin:0 0 10px">${esc(d.justification)}</p>
      <ul class="reasons">
        ${d.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}
        ${d.warnings.map((w) => `<li class="warn">${esc(w)}</li>`).join("")}
      </ul>
      ${i.qualification ? `<p class="note" style="margin:10px 0 0"><strong>Qualification — ${i.qualification.band}.</strong> ${esc(i.qualification.basis)}</p>` : ""}
    </div>

    ${i.injectionFlags.length ? `<div class="banner">Instruction-like text was found inside this item and was NOT acted on: ${i.injectionFlags.map(esc).join(" · ")}</div>` : ""}

    <h3>The item, as the model saw it</h3>
    <div class="card"><div class="src">${esc(i.body)}</div></div>
    ${i.attachments.map((a) => `
      <div class="card">
        <div class="origin" style="margin-bottom:6px">attachment: ${esc(a.filename)}${a.resolved ? "" : " — REFERENCED BUT NOT SUPPLIED"}</div>
        <div class="src">${esc(a.text)}</div>
      </div>`).join("")}

    <h3>Classification</h3>
    <div class="card">
      ${i.classification ? `
        <dl class="grid">
          <dt>category</dt><dd>${esc(S.intentLabels[i.classification.intent])}</dd>
          <dt>confidence</dt><dd>${i.classification.confidence.toFixed(2)}</dd>
          <dt>rationale</dt><dd>${esc(i.classification.rationale)}</dd>
          <dt>evidence</dt><dd class="span">“${esc(i.classification.evidence)}”</dd>
        </dl>` : `<p class="note">No model ran. The item was stopped by the deterministic pre-filter, which is the cheapest and safest place to stop it.</p>`}
    </div>

    <h3>Extracted, with the span each value was read from</h3>
    <div class="card">${fieldRows(i)}</div>
    ${i.droppedFields.length ? `<div class="banner">Grounding discarded ${i.droppedFields.length} field(s): ${i.droppedFields.map((f) => esc(f.field) + " (" + esc(f.reason) + ")").join(", ")}. A value the model could not evidence never reaches a decision.</div>` : ""}

    ${i.reconciliations.length ? `<h3>Document checks — arithmetic, not inference</h3>` + i.reconciliations.map((r) => `
      <div class="card">
        <div><span class="pill ${r.verdict === "agrees" ? "file_and_notify" : r.verdict === "contradicts" ? "quarantine" : "escalate_to_human"}">${r.kind} → ${r.verdict}</span></div>
        <p class="note" style="margin:9px 0 10px">${esc(r.note)}</p>
        <dl class="grid">${Object.entries(r.inputs).map(([k, v]) => `<dt>${esc(k)}</dt><dd class="span">${esc(v)}</dd>`).join("")}</dl>
      </div>`).join("") : ""}

    ${i.crmMatches.length ? `<h3>CRM matching</h3><div class="card"><table><thead><tr><th>row</th><th>company</th><th>score</th><th>signals</th></tr></thead><tbody>
      ${i.crmMatches.map((m) => `<tr><td class="mono">${esc(m.crmId)}</td><td>${esc(m.company)}</td><td class="mono">${m.score.toFixed(2)}</td><td class="span">${m.signals.map(esc).join(", ")}</td></tr>`).join("")}
    </tbody></table></div>` : ""}

    ${i.conflicts.length ? `<h3>Conflicting values</h3>` + i.conflicts.map((c) => `
      <div class="card">
        <div><strong>${esc(c.field)}</strong> ${c.autoResolved ? `<span class="pill file_and_notify">resolved → ${esc(c.resolvedTo)}</span>` : `<span class="pill escalate_to_human">held for a human</span>`}</div>
        <table style="margin-top:8px"><tbody>${c.values.map((v) => `<tr><td class="mono">${esc(v.fromItem)}</td><td>${esc(v.value)}</td><td class="span">“${esc(v.span)}”</td></tr>`).join("")}</tbody></table>
        <p class="note" style="margin:10px 0 0">${esc(c.basis)}</p>
      </div>`).join("") : ""}

    <h3>Response</h3>
    ${renderDraftCard(i)}

    <h3>Audit trail for ${i.id}</h3>
    <div class="card scroll-x"><table><thead><tr><th>#</th><th>stage</th><th>actor</th><th>what happened</th></tr></thead><tbody>
      ${i.trace.map((t) => `<tr><td class="mono">${t.seq}</td><td class="mono">${esc(t.stage)}</td><td class="mono">${esc(t.actor)}</td><td>${esc(t.summary)}</td></tr>`).join("")}
    </tbody></table></div>`;

  wireApproval(pane);
}

function renderDraftCard(i) {
  if (!i.draftId) {
    return `<div class="card"><p class="note">No reply drafted. Policy for this category is <strong>${esc(S.routing[i.decision.intent].responsePolicy)}</strong>${i.decision.action === "log_no_reply" ? ", and this item was absorbed into an existing thread rather than answered again" : ""}.</p></div>`;
  }
  const d = S.approvals.find((a) => a.draftId === i.draftId);
  if (!d) return "";
  return `
    <div class="card">
      <div style="margin-bottom:10px">
        <span class="pill">${esc(d.draftId)}</span>
        <span class="pill ${d.status === "approved" ? "file_and_notify" : d.status === "rejected" ? "quarantine" : "escalate_to_human"}">${esc(d.status)}</span>
        <span class="pill">to ${esc(d.to)}</span>
      </div>
      <div class="draft"><strong>${esc(d.subject)}</strong>\n\n${esc(d.body)}</div>
      ${d.basis.length ? `<h3 style="margin-top:16px">Why the reviewer should trust this draft</h3><ul class="reasons">${d.basis.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
      ${d.status === "awaiting_approval" ? `
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input class="name" data-approver placeholder="your name — approvals must be attributable" size="38" />
          <button class="act primary" data-approve="${esc(d.draftId)}">Approve</button>
          <button class="act danger" data-reject="${esc(d.draftId)}">Reject</button>
        </div>
        <p class="note" style="margin:10px 0 0">Approving records a named decision. It does not send: this build contains no outbound transport, so the counter in the header stays at zero by construction.</p>`
        : `<p class="note" style="margin:12px 0 0">${esc(d.status)} by <strong>${esc(d.decidedBy)}</strong>${d.decidedNote ? " — " + esc(d.decidedNote) : ""}. Still not sent; there is nothing to send it with.</p>`}
    </div>`;
}

function wireApproval(root) {
  root.querySelectorAll("[data-approve]").forEach((b) => b.onclick = () => {
    const approver = root.querySelector("[data-approver]")?.value ?? "";
    load("/api/approve", { draftId: b.dataset.approve, approver });
  });
  root.querySelectorAll("[data-reject]").forEach((b) => b.onclick = () => {
    const approver = root.querySelector("[data-approver]")?.value ?? "";
    load("/api/reject", { draftId: b.dataset.reject, approver, note: "rejected from the inspector" });
  });
}

function renderIdentity() {
  const pane = el("pane");
  pane.innerHTML = `
    <h2>Identity, duplicates and conflicts</h2>
    <p class="note">Three different duplicate problems live in this pack, and they need three different answers.</p>

    ${S.batchWarnings.map((w) => `<div class="banner">${esc(w)}</div>`).join("")}

    <h3>Duplicates inside the CRM export itself</h3>
    ${S.mergeProposals.length ? S.mergeProposals.map((m) => `
      <div class="card">
        <div><span class="pill">${esc(m.proposalId)}</span> <span class="pill">${m.crmIds.map(esc).join(" + ")}</span> <span class="pill escalate_to_human">proposed — not applied</span></div>
        <p class="note" style="margin:9px 0 10px">Matched on <span class="span">${esc(m.reason)}</span>. Survivor proposed: <strong>${esc(m.proposedSurvivor)}</strong> (the more complete row). Nothing was written to the CRM.</p>
        <dl class="grid">${Object.entries(m.proposedMerge).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      </div>`).join("") : `<p class="note">None found.</p>`}

    <h3>Items grouped into organisations</h3>
    ${S.entities.map((e) => `
      <div class="card">
        <div><span class="pill">${esc(e.entityId)}</span> <strong>${esc(e.displayName)}</strong></div>
        <dl class="grid" style="margin-top:9px">
          <dt>items</dt><dd class="mono">${e.itemIds.map(esc).join(", ")}</dd>
          <dt>crm rows</dt><dd class="mono">${e.crmIds.length ? e.crmIds.map(esc).join(", ") : "none — not in the CRM"}</dd>
          <dt>linked by</dt><dd class="span">${e.signals.map(esc).join(", ")}</dd>
        </dl>
        ${e.conflicts.map((c) => `
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
            <strong>${esc(c.field)}</strong>
            ${c.autoResolved ? `<span class="pill file_and_notify">resolved → ${esc(c.resolvedTo)}</span>` : `<span class="pill escalate_to_human">held for a human</span>`}
            <table style="margin-top:7px"><tbody>${c.values.map((v) => `<tr><td class="mono">${esc(v.fromItem)}</td><td>${esc(v.value)}</td></tr>`).join("")}</tbody></table>
            <p class="note" style="margin:8px 0 0">${esc(c.basis)}</p>
          </div>`).join("")}
      </div>`).join("")}`;
}

function renderApprovals() {
  const pane = el("pane");
  const waiting = S.approvals.filter((d) => d.status === "awaiting_approval");
  pane.innerHTML = `
    <h2>Approval queue</h2>
    <div class="banner good">${S.approvals.length} draft(s) prepared · ${waiting.length} awaiting a named human · <strong>${S.stats.draftsSent} sent</strong>. The sent counter is zero because this build has no outbound transport. It is not a setting.</div>
    ${S.approvals.map((d) => {
      const item = S.items.find((i) => i.draftId === d.draftId);
      return `<div class="card">
        <div style="margin-bottom:9px">
          <span class="pill">${esc(d.draftId)}</span> <span class="pill">${esc(d.itemId)}</span>
          <span class="pill ${d.status === "approved" ? "file_and_notify" : d.status === "rejected" ? "quarantine" : "escalate_to_human"}">${esc(d.status)}</span>
          <span class="pill">owner ${esc(d.ownerName)}</span> <span class="pill">to ${esc(d.to)}</span>
        </div>
        <div class="draft"><strong>${esc(d.subject)}</strong>\n\n${esc(d.body)}</div>
        ${d.basis.length ? `<ul class="reasons" style="margin-top:11px">${d.basis.map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}
        ${d.status === "awaiting_approval" ? `
          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
            <input class="name" data-approver placeholder="your name" size="26" />
            <button class="act primary" data-approve="${esc(d.draftId)}">Approve</button>
            <button class="act danger" data-reject="${esc(d.draftId)}">Reject</button>
          </div>` : `<p class="note" style="margin-top:11px">${esc(d.status)} by <strong>${esc(d.decidedBy)}</strong>. Not sent.</p>`}
      </div>`;
    }).join("")}`;
  // Each card carries its own approver box, so wire per card.
  pane.querySelectorAll(".card").forEach((c) => wireApproval(c));
}

function renderAudit() {
  const pane = el("pane");
  const all = S.items.flatMap((i) => i.trace);
  pane.innerHTML = `
    <h2>Audit log</h2>
    <p class="note">Append-only and hash-chained: each row carries the hash of the one before it, so an edited or deleted row breaks the chain and verification says where. Timestamps come from the sequence number, not the wall clock, so the same input produces a byte-identical log.</p>
    <div class="banner ${S.auditVerified.ok ? "good" : ""}">${S.auditVerified.ok ? "Chain verified intact across every entry." : "CHAIN BROKEN at #" + S.auditVerified.brokenAtSeq}</div>
    <div class="card scroll-x"><table><thead><tr><th>#</th><th>item</th><th>stage</th><th>actor</th><th>what happened</th><th>hash</th></tr></thead><tbody>
      ${all.sort((a, b) => a.seq - b.seq).map((t) => `<tr>
        <td class="mono">${t.seq}</td><td class="mono">${esc(t.itemId)}</td><td class="mono">${esc(t.stage)}</td>
        <td class="mono">${esc(t.actor)}</td><td>${esc(t.summary)}</td><td class="span">${esc(t.hash.slice(0, 10))}…</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderData() {
  const pane = el("pane");
  pane.innerHTML = `
    <h2>Source data, as supplied</h2>
    ${S.ingestIssues.length ? `<h3>Ingest notes</h3>` + S.ingestIssues.map((i) => `<div class="banner">${esc(i)}</div>`).join("") : ""}

    <h3>Staff directory — the only source of ownership</h3>
    <div class="card"><table><thead><tr><th>name</th><th>role</th><th>owns</th></tr></thead><tbody>
      ${Object.values(S.staff).map((s) => `<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td class="note">${esc(s.owns)}</td></tr>`).join("")}
    </tbody></table></div>

    <h3>CRM export — read-only</h3>
    <div class="card scroll-x"><table><thead><tr><th>id</th><th>company</th><th>contact</th><th>email</th><th>phone</th><th>location</th><th>stage</th><th>interest</th></tr></thead><tbody>
      ${S.crm.map((r) => `<tr><td class="mono">${esc(r.id)}</td><td>${esc(r.company)}</td><td>${esc(r.contact)}</td><td class="span">${esc(r.email)}</td><td class="mono">${esc(r.phone || "—")}</td><td>${esc(r.location)}</td><td>${esc(r.stage)}</td><td>${esc(r.interest)}</td></tr>`).join("")}
    </tbody></table></div>

    <h3>Routing table</h3>
    <div class="card scroll-x"><table><thead><tr><th>category</th><th>owner</th><th>destination</th><th>reply policy</th><th>why this owner</th></tr></thead><tbody>
      ${Object.entries(S.routing).map(([k, r]) => `<tr><td>${esc(S.intentLabels[k])}</td><td>${esc(r.owner)}</td><td class="mono">${esc(r.destination)}</td><td class="mono">${esc(r.responsePolicy)}</td><td class="note">${esc(r.justification)}</td></tr>`).join("")}
    </tbody></table></div>

    <h3>Run statistics</h3>
    <div class="card"><dl class="grid">
      ${Object.entries(S.stats).map(([k, v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join("")}
      <dt>crm rows modified</dt><dd class="mono">0 — the export is read-only by design</dd>
    </dl></div>`;
}

el("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  el("tabs").querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
  render();
});

load("/api/state");
</script>
</body>
</html>
